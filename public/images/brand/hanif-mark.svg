<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">HANIF. geometric H mark</title>
  <desc id="desc">A geometric H monogram inspired by folded architectural planes, in a purple to blue gradient.</desc>
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#9B6BFF"/>
      <stop offset="0.55" stop-color="#7545F4"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7EA5FF"/>
      <stop offset="0.55" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#4B75E8"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#6841D8"/>
      <stop offset="0.52" stop-color="#7249E8"/>
      <stop offset="1" stop-color="#557FF2"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B487FF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#6A8FFF" stop-opacity=".15"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.40  0 0 0 0 0.25  0 0 0 0 1  0 0 0 .28 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- left vertical pillar -->
    <polygon points="55,32 116,74 116,288 55,246" fill="url(#left)"/>
    <!-- left inner fold -->
    <polygon points="116,74 145,94 145,307 116,288" fill="url(#facet)" opacity=".72"/>

    <!-- right vertical pillar -->
    <polygon points="204,74 265,32 265,246 204,288" fill="url(#right)"/>
    <!-- right inner fold -->
    <polygon points="175,94 204,74 204,288 175,307" fill="url(#facet)" opacity=".5"/>

    <!-- restrained horizontal H bridge -->
    <polygon points="116,128 204,188 204,244 116,184" fill="url(#bridge)"/>

    <!-- subtle top plane accents -->
    <polygon points="55,32 116,74 116,106 55,64" fill="#A274FF" opacity=".28"/>
    <polygon points="204,74 265,32 265,64 204,106" fill="#86AAFF" opacity=".24"/>
  </g>
</svg>